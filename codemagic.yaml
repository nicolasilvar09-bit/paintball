# Paintball do Balneário — build do app iOS (Capacitor) e envio para o TestFlight
workflows:
  ios-appstore:
    name: Paintball iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: paintball_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nicolas.paintballbalneario
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preparar arquivos do jogo
        script: |
          set -e
          mkdir -p www assets
          cp index.html privacidade.html www/
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o www/three.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js -o www/supabase.js
          sed -i '' -e 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#g' -e 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js#supabase.js#g' www/index.html
          grep -c "three.min.js" www/index.html
          cp icon-1024.png assets/icon-only.png
          cp splash.png assets/splash.png
          cp splash.png assets/splash-dark.png
      - name: Instalar dependências
        script: npm install --no-audit --no-fund
      - name: Criar projeto iOS
        script: |
          set -e
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#0b1219' --iconBackgroundColorDark '#0b1219' --splashBackgroundColor '#0b1219' --splashBackgroundColorDark '#0b1219'
          npx cap sync ios
      - name: Ajustes do app (Entrar com a Apple, nome, versão)
        script: |
          set -e
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Paintball" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Paintball" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PL" || true
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.developer.applesignin</key><array><string>Default</string></array></dict></plist>
          PLIST
          sed -i '' -e 's/^ *//' ios/App/App/App.entitlements
          ruby -e "require 'xcodeproj'; p=Xcodeproj::Project.open('ios/App/App.xcodeproj'); p.targets.each{|t| t.build_configurations.each{|c| c.build_settings['CODE_SIGN_ENTITLEMENTS']='App/App.entitlements'; c.build_settings['CURRENT_PROJECT_VERSION']=ENV['PROJECT_BUILD_NUMBER']||'1'; c.build_settings['MARKETING_VERSION']='1.0'; c.build_settings['TARGETED_DEVICE_FAMILY']='1,2'}}; p.save"
      - name: Assinatura
        script: xcode-project use-profiles
      - name: Gerar o app (IPA)
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
